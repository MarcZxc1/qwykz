services:
  qwykz-db:
    image: postgres:17-alpine
    container_name: t-hono-docker-postgres
    command: postgres -c synchronous_commit=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwykz_local_password
      POSTGRES_DB: t-hono-docker
    ports:
      - "127.0.0.1:54689:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d t-hono-docker"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - t-hono-docker_data:/var/lib/postgresql/data

volumes:
  t-hono-docker_data:
