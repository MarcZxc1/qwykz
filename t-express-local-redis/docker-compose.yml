services:
  qwykz-redis:
    image: redis:7-alpine
    container_name: t-express-local-redis-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:63333:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - t-express-local-redis_redis_data:/data

volumes:
  t-express-local-redis_redis_data:
